version: 2

updates:
  # ----------------------------------------------------------------------
  # Application dependencies
  # ----------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    # Grouped so a quiet week is one or two pull requests rather than a dozen.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    groups:
      # These have to move together. Svelte and the tools that compile or
      # check its components (svelte-check, the ESLint plugin, the testing
      # library) are versioned against it; Vitest builds on Vite and its
      # coverage plugin is versioned with it. Splitting them produces pull
      # requests that cannot pass alone.
      svelte:
        patterns:
          - svelte
          - svelte-check
          - eslint-plugin-svelte
          - "@testing-library/svelte"
      # The Svelte plugin for Vite peers on both, but its majors follow
      # Vite's, so it moves with Vite.
      vite:
        patterns:
          - vite
          - vitest
          - "@vitest/*"
          - "@sveltejs/*"
      # @eslint/js peers on the same ESLint major, so a major of one alone
      # leaves the pair mismatched.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"

      # Everything the app actually ships. Kept apart from tooling so a
      # failing check here means something a user would notice.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch

      # Tooling: test runner, linters, wrangler. Noisy and low-risk, so it all
      # arrives in one pull request.
      tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

    # Majors outside the `svelte`, `vite` and `eslint` groups are left ungrouped on
    # purpose: they get their own pull request, because they are the ones
    # worth reading.

  # ----------------------------------------------------------------------
  # The workflow's own actions
  # ----------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
